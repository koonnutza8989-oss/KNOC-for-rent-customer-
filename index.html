<!DOCTYPE html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>KNOC ชุดให้เช่า</title><link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Noto+Sans+Thai:wght@400;500;700&display=swap" rel="stylesheet"><style>:root{--bg:#e9f6ef;--card:#fffaf3;--ink:#4a2b22;--soft:#7b5a4d;--line:#cfe3d8;--mint:#bfe6d3;--deep:#2a8f6e;--head:#4a2b22;--oncho:#fffaf3;--busy:#4a2b22;--free-fg:#17503c;--on-deep:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#111915;--card:#1b2621;--ink:#f0e6dc;--soft:#b8a99d;--line:#304339;--mint:#2c5645;--deep:#43c297;--head:#2a1914;--oncho:#fff3e8;--busy:#5b372c;--free-fg:#bff0dc;--on-deep:#06241a;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
header.top{background:var(--head);color:var(--oncho);padding:8px 0}header .wrap{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
h1{font-family:'Mali','Noto Sans Thai',sans-serif;font-size:1.3rem;margin:0}header span{color:var(--mint)}header small{margin-left:auto;opacity:.75}
.bar{position:sticky;top:0;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line);z-index:5}
.bar input{width:100%;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:10px 16px;min-height:44px;font:inherit}
.chips{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font:inherit;font-size:.92rem;min-height:36px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--deep);border-color:var(--deep);color:var(--on-deep)}
main{padding:16px 0 50px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.ph{aspect-ratio:3/4;background:var(--mint);position:relative}.ph img{width:100%;height:100%;object-fit:cover;display:block}
.noimg{width:100%;height:100%;display:grid;place-items:center;font-size:2.4rem;color:var(--deep)}
.badge{position:absolute;left:8px;top:8px;border-radius:999px;padding:2px 10px;font-size:.82rem;font-weight:700}
.b-free{background:var(--mint);color:var(--free-fg)}.b-busy{background:var(--busy);color:var(--oncho)}
.info{padding:10px 12px 12px}h3{margin:0;font-size:1rem;overflow-wrap:anywhere}
.m{margin:2px 0 0;color:var(--soft);font-size:.9rem}.d{margin:6px 0 0;font-size:.88rem;font-weight:700;font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:64px 16px;background:var(--card);border:1.5px dashed var(--line);border-radius:16px}.empty h2{margin:0;font-family:'Mali','Noto Sans Thai',sans-serif;font-size:1.3rem}</style></head><body><header class="top"><div class="wrap"><h1>KNOC</h1><span>ชุดให้เช่า</span><small id="upd"></small></div></header><div class="bar"><div class="wrap"><input id="q" type="search" placeholder="ค้นหาชื่อชุด" aria-label="ค้นหาชื่อชุด" autocomplete="off"><div class="chips" id="chips"></div></div></div><main class="wrap" id="list"></main><script>(function customerApp(D){
  var $=function(x){return document.querySelector(x);};
  var q='',f='all';
  var esc=function(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
  var fmt=function(t){var p=t.split('-');return (+p[2])+'/'+(+p[1])+'/'+p[0];};
  var u=D.updated.split('-'); $('#upd').textContent='อัปเดต '+(+u[2])+'/'+(+u[1])+'/'+u[0];
  function chips(){
    var d=[['all','ทั้งหมด'],['free','ว่าง'],['busy','ไม่ว่าง']];
    $('#chips').innerHTML=d.map(function(x){return '<button type="button" class="chip" data-f="'+x[0]+'" aria-pressed="'+(f===x[0])+'">'+x[1]+'</button>';}).join('');
  }
  function render(){
    var list=D.items.filter(function(c){
      if(q&&(c.name||'').toLowerCase().indexOf(q)<0) return false;
      if(f==='free') return !c.b;
      if(f==='busy') return !!c.b;
      return true;
    });
    if(!list.length){ $('#list').innerHTML='<div class="empty"><h2>'+(D.items.length?'ไม่พบชุดที่ค้นหา':'ยังไม่มีชุด')+'</h2></div>'; return; }
    $('#list').innerHTML='<div class="grid">'+list.map(function(c){
      var img=c.img?'<img src="'+c.img+'" alt="">':'<div class="noimg">'+esc((c.name||'?').charAt(0).toUpperCase())+'</div>';
      return '<article class="card"><div class="ph">'+img+'<span class="badge '+(c.b?'b-busy':'b-free')+'">'+(c.b?'ไม่ว่าง':'ว่าง')+'</span></div><div class="info"><h3>'+esc(c.name)+'</h3>'+
        (c.size?'<p class="m">ไซส์ '+esc(c.size)+'</p>':'')+
        '<p class="m">ไพร '+(esc(c.pre)||'-')+' · เทส '+(esc(c.test)||'-')+'</p>'+
        (c.b?'<p class="d">ไม่ว่าง '+fmt(c.b[0])+' ถึง '+fmt(c.b[1])+'</p>':'')+'</div></article>';
    }).join('')+'</div>';
  }
  $('#q').addEventListener('input',function(e){ q=e.target.value.trim().toLowerCase(); render(); });
  $('#chips').addEventListener('click',function(e){ var b=e.target.closest('[data-f]'); if(!b) return; f=b.getAttribute('data-f'); chips(); render(); });
  chips(); render();
